info:
  description: 'Public HTTP front: auth (JWT + EIP-191), config, /responses; proxies
    to runtime_host on loopback.'
  title: Agentic Agent Node — Gateway Host API
  version: "1.0"
openapi: 3.1.0
paths:
  /.well-known/6022:
    get:
      description: Open 6022 discovery document; documents POST /responses and its
        bounded `instructions` overlay.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.WellKnownAgent6022'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: Not Found
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnavailableError'
          description: Bad Gateway
      summary: 6022 agent card
      tags:
      - "6022"
  /.well-known/agent-card.json:
    get:
      description: Open A2A v1.0 agent card (ProtoJSON); advertises SendMessage. Errors
        until the node is registered.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.WellKnownAgentCard'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: Not Found
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnavailableError'
          description: Bad Gateway
      summary: A2A agent card
      tags:
      - A2A
  /a2a:
    post:
      description: 'JSON-RPC 2.0 SendMessage (A2A v1.0): one inference turn, immediate
        reply. x402-gated like /responses.'
      parameters:
      - description: x402 v2 payment payload (base64 JSON)
        in: header
        name: PAYMENT-SIGNATURE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.A2ARequest'
                description: JSON-RPC SendMessage request
                summary: request
        description: JSON-RPC SendMessage request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.A2AResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnauthorizedError'
          description: Unauthorized
        "402":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/x402.PaymentRequired'
          description: Payment Required
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ConflictError'
          description: conversation_unavailable or agent_not_minted
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnavailableError'
          description: runtime_unavailable
      summary: A2A SendMessage (JSON-RPC)
      tags:
      - A2A
  /agent/collections:
    get:
      parameters:
      - in: query
        name: chainId
        required: true
        schema:
          form: chainId
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentCollectionsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnauthorizedError'
