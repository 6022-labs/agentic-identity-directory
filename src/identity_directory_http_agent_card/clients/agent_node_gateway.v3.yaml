  /responses:
    post:
      description: 'x402 v2 gated (PAYMENT-SIGNATURE header): callers pay the cheapest
        matching option; zero-price is free.'
      parameters:
      - description: Bearer JWT; a caller the policy lets in free needs no payment
        in: header
        name: Authorization
        schema:
          type: string
      - description: x402 v2 payment payload (base64 JSON), required unless free
        in: header
        name: PAYMENT-SIGNATURE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.CreateResponseRequest'
                description: Conversation turn
                summary: request
        description: Conversation turn
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
          description: OK
          headers:
            PAYMENT-RESPONSE:
              description: base64 x402 settle response, paid requests only
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "402":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/x402.PaymentRequired'
          description: Payment Required
          headers:
            PAYMENT-REQUIRED:
              description: base64 x402 payment requirements
              schema:
                type: string
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ConflictError'
          description: conversation_unavailable or agent_not_minted
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnavailableError'
          description: access_decision_unavailable or facilitator_unavailable
      summary: Create response
      tags:
      - Responses
