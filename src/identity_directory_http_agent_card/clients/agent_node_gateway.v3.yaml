  /auth/challenge:
    get:
      description: Returns a fresh SIWE (EIP-4361) message + expiry; sign it verbatim
        (EIP-191) and post to /auth/verify.
      parameters:
      - description: wallet address the message is issued for
        in: query
        name: address
        required: true
        schema:
          type: string
      - description: chain id of the connected wallet
        in: query
        name: chainId
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetAuthChallengeResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.InternalError'
          description: challenge_failed
      summary: Auth challenge
      tags:
      - Auth
  /auth/logout:
    post:
      description: Revokes the session behind the refresh token; idempotent.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.RefreshTokenRequest'
                description: Refresh token
                summary: request
        description: Refresh token
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
      summary: Auth logout
      tags:
      - Auth
  /auth/refresh:
    post:
      description: |-
        Spends the refresh token (valid jwt.refresh_idle_ttl after issue, at most jwt.refresh_ttl
        after sign-in), re-checks NFT ownership, issues a HS256 JWT and the next refresh token.
        401 codes: refresh_token_missing, refresh_token_invalid, session_revoked,
        refresh_token_reused, not_authorized
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.RefreshTokenRequest'
                description: Refresh token
                summary: request
        description: Refresh token
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RefreshAuthResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnauthorizedError'
          description: codes listed in the description
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.InternalError'
          description: refresh_failed
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnavailableError'
          description: identity_not_found
      summary: Auth refresh
      tags:
      - Auth
  /auth/verify:
    post:
      description: |-
        Rebuilds the EIP-4361 message, verifies the EIP-191 signature, checks NFT ownership,
        issues a HS256 JWT and a refresh token.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.VerifyAuthRequest'
                description: Address + signature
                summary: request
        description: Address + signature
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.VerifyAuthResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnauthorizedError'
          description: challenge_not_found, signature_mismatch or not_authorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.InternalError'
          description: verify_failed
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnavailableError'
          description: identity_not_found
      summary: Auth verify
      tags:
      - Auth
