basePath: /
definitions:
  errors.BadRequestError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  errors.InternalError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  errors.NotFoundError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  errors.UnavailableError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  errors.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  responses.AgentAddressResponse:
    properties:
      type:
        type: string
      value:
        type: string
    type: object
  responses.AgentCardResponse:
    properties:
      endpoints:
        additionalProperties:
          type: string
        type: object
      ensName:
        type: string
      name:
        type: string
      paymentMethods:
        items:
          type: string
        type: array
      protocol:
        type: string
      protocolVersion:
        type: string
      url:
        type: string
      verified:
        type: boolean
    type: object
  responses.AgentCollectionResponse:
    properties:
      address:
        type: string
      chainId:
        type: integer
      description:
        type: string
      name:
        type: string
      symbol:
        type: string
    type: object
  responses.AgentResponse:
    properties:
      addresses:
        items:
          $ref: '#/definitions/responses.AgentAddressResponse'
        type: array
      attributes:
        additionalProperties:
          type: string
        type: object
      chainId:
        type: integer
      cloneOf:
        type: string
      collectionAddress:
        type: string
      collectionName:
        type: string
      creator:
        type: string
      ensName:
        type: string
      ensRecords:
