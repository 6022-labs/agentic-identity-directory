info:
  description: Directory of the 6022 agents registered on-chain, also served over
    MCP at /mcp.
  title: Agentic Identity Directory API
  version: "1.0"
openapi: 3.1.0
paths:
  /agents:
    get:
      description: Finds indexed 6022 agents; every field is written by the agent's
        owner.
      parameters:
      - description: words in agent names, collections and attributes
        in: query
        name: query
        schema:
          type: string
      - description: exact role attribute
        in: query
        name: role
        schema:
          type: string
      - description: EVM chain id
        in: query
        name: chainId
        schema:
          type: integer
      - description: 0x collection address
        in: query
        name: collectionAddress
        schema:
          type: string
      - description: 0x owner address
        in: query
        name: owner
        schema:
          type: string
      - description: one of the agent's own addresses
        in: query
        name: address
        schema:
          type: string
      - description: 'true or false: has a published url'
        in: query
        name: published
        schema:
          type: string
      - description: page, from 1
        in: query
        name: page
        schema:
          type: integer
      - description: 1 to 100, 10 by default
        in: query
        name: elementsPerPage
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.SearchAgentsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/errors.ValidationError'
                - $ref: '#/components/schemas/errors.BadRequestError'
          description: invalid_query
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.InternalError'
          description: Internal Server Error
      summary: Search agents
      tags:
      - Agents
  /agents/{chainId}/{collectionAddress}/{tokenId}:
    get:
      parameters:
      - description: EVM chain id
        in: path
        name: chainId
        required: true
        schema:
          type: integer
      - description: 0x collection address
        in: path
        name: collectionAddress
        required: true
        schema:
          type: string
      - description: decimal token id
        in: path
        name: tokenId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/errors.ValidationError'
                - $ref: '#/components/schemas/errors.BadRequestError'
          description: invalid_path
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: agent_not_found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.InternalError'
          description: Internal Server Error
      summary: Get an agent
      tags:
      - Agents
  /agents/ens/{ensName}:
    get:
      parameters:
      - description: e.g. my-agent.my-collection.137.6022.eth
        in: path
        name: ensName
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/errors.ValidationError'
                - $ref: '#/components/schemas/errors.BadRequestError'
          description: invalid_path
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: agent_not_found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.InternalError'
          description: Internal Server Error
      summary: Get an agent by ENS name
      tags:
      - Agents
  /agents/ens/{ensName}/card:
    get:
      description: Fetches the agent's /.well-known/6022 and checks its signature
        against the agent's addresses.
      parameters:
      - description: e.g. my-agent.my-collection.137.6022.eth
        in: path
        name: ensName
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentCardResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/errors.ValidationError'
                - $ref: '#/components/schemas/errors.BadRequestError'
          description: invalid_path
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: agent_not_found or agent_url_not_published
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.InternalError'
          description: Internal Server Error
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnavailableError'
          description: the card is unreachable, invalid or wrongly signed
      summary: Get an agent's live card
      tags:
      - Agents
  /collections:
    get:
      parameters:
      - description: EVM chain id
        in: query
        name: chainId
        schema:
          type: integer
      - description: page, from 1
        in: query
        name: page
        schema:
          type: integer
      - description: 1 to 100, 10 by default
        in: query
        name: elementsPerPage
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ListCollectionsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/errors.ValidationError'
                - $ref: '#/components/schemas/errors.BadRequestError'
          description: invalid_query
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.InternalError'
          description: Internal Server Error
      summary: List agent collections
      tags:
      - Collections
  /health:
    get:
      description: Liveness probe for the identity directory.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetHealthResponse'
          description: OK
      summary: Health check
      tags:
      - Health
servers:
- url: /
