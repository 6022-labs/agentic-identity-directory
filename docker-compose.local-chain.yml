# Local Anvil chain (31337) with the 6022 contracts at the addresses baked for 31337:
#   docker compose -f docker-compose.yml -f docker-compose.local-chain.yml up
services:
  identity-directory:
    environment:
      - CHAINS__31337__RPC_HTTP_URL=http://identity-directory-evm-node:8545
      - CHAINS__31337__TESTNET=true
      - CHAINS__31337__CONFIRMATIONS=0
      - CHAINS__31337__POLL_INTERVAL_SECONDS=2
      # Local agents run on private addresses.
      - AGENT_CARD__ALLOW_PRIVATE_NETWORKS=true
    depends_on:
      identity-directory-contracts-deployer:
        condition: service_completed_successfully

  identity-directory-evm-node:
    image: "ghcr.io/foundry-rs/foundry:v1.8.6"
    container_name: identity-directory-evm-node
    user: root # the state volume is root-owned
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--state", "/data/anvil-state.json", "--state-interval", "5"]
    ports:
      - "8545:8545"
    volumes:
      - identity-directory-chain-data:/data
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 5s
      retries: 15

  identity-directory-contracts-deployer:
    image: "ghcr.io/6022-labs/agentic-smart-contracts-anvil-deployer:1.0.0"
    container_name: identity-directory-contracts-deployer
    environment:
      - ANVIL_RPC_URL=http://identity-directory-evm-node:8545
      # Must match the 31337 addresses baked in agent_contracts.json.
      - EXPECTED_CONTRACTS=AgentCollectionsManager=0x9fe46736679d2d9a65f0992f2272de9f3c7fa6e0,AgentCollectionCreatorV1=0xcf7ed3acca5a467e9e704c703e8d87f634fb0fc9,AgentEnsRegistry=0x5fc8d32690cc91d4c39d9d3abcbd16989f875707
    depends_on:
      identity-directory-evm-node:
        condition: service_healthy

volumes:
  identity-directory-chain-data:
